name: Sync upstream

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write

# A manual run and the scheduled run must never race each other's force-push.
concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT_TOKEN }}

      - name: Rebase our fork-only commits onto upstream
        id: sync
        run: |
          # Only used as a fallback identity; every replayed commit has its
          # committer reset to match its own author via --exec below, so
          # github-actions[bot] never ends up attributed as a contributor.
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git remote add upstream https://github.com/andyaiken/forgesteel.git
          git fetch upstream
          git checkout main

          # main always carries our fork-only commits on top, so it never equals
          # upstream/main; check whether upstream is already in main's history.
          if git merge-base --is-ancestor upstream/main main; then
            echo "Already up to date with upstream."
            echo "rebased=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git rebase upstream/main --exec 'GIT_COMMITTER_NAME="$(git log -1 --format=%an)" GIT_COMMITTER_EMAIL="$(git log -1 --format=%ae)" GIT_COMMITTER_DATE="$(git log -1 --format=%ad)" git commit --amend --no-edit'; then
            echo "rebased=true" >> "$GITHUB_OUTPUT"
          else
            echo "Rebase conflict - needs manual resolution:"
            git diff --name-only --diff-filter=U
            git rebase --abort
            exit 1
          fi

      # A rebase can apply cleanly yet still break the build (e.g. upstream
      # renames something a fork-only commit uses), so verify before pushing.
      - uses: actions/setup-node@v4
        if: steps.sync.outputs.rebased == 'true'
        with:
          node-version: 24
          cache: 'npm'

      - name: Verify rebased code builds and passes tests
        if: steps.sync.outputs.rebased == 'true'
        run: |
          npm ci --no-audit --no-fund
          npx tsc -p tsconfig.json
          npx vitest run

      - name: Push rebased main
        if: steps.sync.outputs.rebased == 'true'
        run: git push --force-with-lease origin main

      - name: Trigger image build
        if: steps.sync.outputs.rebased == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run build-and-push.yml --ref main --repo RickyTan01/forgesteel
